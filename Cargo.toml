[package]
name = "osx-cargo-dedupe"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deduplicate identical files across Rust cargo target directories on macOS APFS using copy-on-write clones"
license = "MIT"
repository = "https://github.com/judeallred/osx-cargo-dedupe"
readme = "README.md"
keywords = ["cargo", "apfs", "dedupe", "clonefile", "macos"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
indicatif = "0.18.6"
libc = "0.2.191"
rayon = "1.12.0"
walkdir = "2.5.0"

[package]
name = "osx-cargo-dedupe"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deduplicate identical files across Rust cargo target directories on macOS APFS using copy-on-write clones"
license = "MIT"
repository = "https://github.com/judeallred/osx-cargo-dedupe"
readme = "README.md"
keywords = ["cargo", "apfs", "dedupe", "clonefile", "macos"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16"
ctrlc = "3.5.2"
indicatif = "0.18.6"
libc = "0.2.191"
rayon = "1.12.0"
walkdir = "2.5.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
# Conflicts with rustc's `unreachable_pub`, which this crate follows instead.
redundant_pub_crate = "allow"

[dev-dependencies]
tempfile = "3.27.0"
